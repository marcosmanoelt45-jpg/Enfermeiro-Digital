<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <meta name="description" content="Enfere - Plataforma de raciocínio clínico, Processo de Enfermagem COFEN nº 736/2024, simulações realísticas e videoteca de habilidades de enfermagem." />
    <title>Enfere · Simulação & Raciocínio Clínico de Enfermagem</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('enfermeiro_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}

        // Interceptador de navegação no nível do navegador (Chromium / Opera GX Navigation API)
        try {
          if (typeof window !== 'undefined' && window.navigation && typeof window.navigation.addEventListener === 'function') {
            window.navigation.addEventListener('navigate', function(e) {
              try {
                if (e.destination && e.destination.url && e.destination.url.indexOf('dbhldtzf') !== -1) {
                  e.preventDefault();
                  window.location.replace(e.destination.url.replace(/dbhldtzf/g, 'dbhltdzf'));
                }
              } catch(err) {}
            });
          }
        } catch(e) {}

        // Purga imediata de Service Workers e CacheStorage obsoletos antes do boot do React
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].update().catch(function() {});
                regs[i].unregister().catch(function() {});
              }
            }).catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) {
                caches.delete(keys[i]).catch(function() {});
              }
            }).catch(function() {});
          }
        } catch(e) {}
      })();
    </script>
    <script src="/registerSW.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
