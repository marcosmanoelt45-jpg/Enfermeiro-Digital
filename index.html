<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Enfere - Plataforma de raciocínio clínico, Processo de Enfermagem COFEN nº 736/2024, simulações realísticas e videoteca de habilidades de enfermagem." />
    <title>Enfere · Simulação & Raciocínio Clínico de Enfermagem</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('enfermeiro_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }

          if (!localStorage.getItem('enfermeiro_digital_local_user')) {
            localStorage.setItem('enfermeiro_digital_local_user', JSON.stringify({
              id: 'aluno-demo',
              email: 'aluno@enfere.edu.br',
              name: 'Mariana Duarte',
              full_name: 'Mariana Duarte',
              role: 'aluno',
              user_type: 'aluno'
            }));
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
